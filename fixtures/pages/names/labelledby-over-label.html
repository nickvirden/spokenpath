<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Name from aria-labelledby over aria-label</title>
</head>
<body>
<p>
<span id="label">Labelledby text</span>
<button id="target" type="button" aria-labelledby="label" aria-label="Aria label text">Button content</button>
</p>
</body>
</html>
