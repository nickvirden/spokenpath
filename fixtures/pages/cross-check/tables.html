<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layout and data tables</title>
</head>
<body>
<table id="layout">
<tr><td id="left">Left</td><td id="right">Right</td></tr>
</table>
<table id="data">
<caption id="caption">Opening hours</caption>
<tr><th id="day">Day</th><th id="hours">Hours</th></tr>
<tr><td id="monday">Monday</td><td id="nine">9 to 5</td></tr>
</table>
</body>
</html>
