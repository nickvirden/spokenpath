<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A closed select with an option group</title>
</head>
<body>
<label for="flavour">Flavour</label>
<select id="flavour">
<optgroup id="fruit" label="Fruit">
<option id="apple">Apple</option>
<option id="pear">Pear</option>
</optgroup>
</select>
</body>
</html>
