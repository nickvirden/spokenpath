<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Landmarks and headings</title>
</head>
<body>
<header id="banner"><p>Site name</p></header>
<nav id="site-nav" aria-label="Site">
<a id="link-home" href="index.html">Home</a>
<a id="link-about" href="about.html">About</a>
</nav>
<main id="main">
<h1 id="heading-1">Page title</h1>
<h2 id="heading-2">Section heading</h2>
<h3 id="heading-3">Subsection heading</h3>
<section id="region" aria-label="Featured">
<p>Featured content</p>
</section>
<form id="contact" aria-label="Contact">
<p><label for="full-name">Full name</label> <input id="full-name" type="text"></p>
<p><label><input id="subscribe" type="checkbox"> Subscribe</label></p>
<p><label><input id="plan-basic" type="radio" name="plan" value="basic"> Basic</label></p>
<p><label><input id="plan-pro" type="radio" name="plan" value="pro"> Pro</label></p>
<p><label for="country">Country</label> <select id="country"><option>Canada</option><option>Mexico</option></select></p>
<p><label for="message">Message</label> <textarea id="message"></textarea></p>
<p><button id="send" type="submit">Send</button></p>
</form>
<search id="site-search"><p>Search tools</p></search>
</main>
<aside id="aside"><p>Related reading</p></aside>
<footer id="footer"><p>Footer text</p></footer>
</body>
</html>
