<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Listbox with a selected option</title>
</head>
<body>
<div id="fruit" role="listbox" aria-label="Fruit" tabindex="0">
<div id="apple" role="option" aria-selected="false">Apple</div>
<div id="pear" role="option" aria-selected="true">Pear</div>
<div id="plum" role="option" aria-selected="false">Plum</div>
</div>
</body>
</html>
