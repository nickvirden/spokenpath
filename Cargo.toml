[workspace]
resolver = "3"
members = [
  "crates/spokenpath_snapshot",
  "crates/spokenpath_model",
  "crates/spokenpath_announce",
  "crates/spokenpath_cli",
  "crates/spokenpath_ax_macos",
  "tasks/xtask",
]

# One version for the whole repository (ADR-0004). The release commit sets it
# through scripts/set-version.mjs, together with Cargo.lock and every
# package.json; never edit it by hand.
[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nickvirden/spokenpath"
publish = false

[workspace.dependencies]
insta = "=1.49.0"
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_path_to_error = "=0.1.20"
sha2 = { version = "=0.11.1", default-features = false }
spokenpath_announce = { path = "crates/spokenpath_announce" }
spokenpath_model = { path = "crates/spokenpath_model" }
spokenpath_snapshot = { path = "crates/spokenpath_snapshot" }

# unsafe_code is denied rather than forbidden, so a crate that needs FFI can
# allow it locally with a stated reason. CI turns every warning into an error.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
