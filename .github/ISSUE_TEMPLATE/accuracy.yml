name: "Accuracy report: output disagrees with a real browser or screen reader"
description: The tool's output disagrees with a real browser or screen reader.
title: "accuracy: "
labels: ["accuracy"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form when spokenpath's output disagrees with what a real browser exposes or what
        a real screen reader said. Versions and a minimal page make a report checkable, so the
        required fields are needed.
  - type: input
    id: spokenpath-version
    attributes:
      label: spokenpath version or commit
      description: The version, or the commit SHA if you built from source.
      placeholder: "0.1.0, or a commit SHA"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: The browser spokenpath captured with, and the browser you compared against.
      placeholder: "Captured with Chromium <version>; compared with Safari <version>"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: "macOS 26.1"
    validations:
      required: true
  - type: input
    id: screen-reader
    attributes:
      label: Screen reader and version
      description: Leave empty when the comparison involves only a browser.
      placeholder: "VoiceOver on macOS 26.1"
    validations:
      required: false
  - type: textarea
    id: minimal-page
    attributes:
      label: Minimal page
      description: |
        The smallest HTML page that shows the difference. This issue is public: reduce the page
        to a synthetic example, and do not paste secrets, tokens, cookies, internal URLs or
        personal data.
      render: html
    validations:
      required: true
  - type: textarea
    id: spokenpath-output
    attributes:
      label: What spokenpath showed
      description: Paste the relevant lines of the transcript or JSON output.
      render: text
    validations:
      required: true
  - type: textarea
    id: real-output
    attributes:
      label: What the real browser or screen reader exposed or said
      description: |
        For a browser, what its accessibility inspector showed. For a screen reader, what it said,
        with any settings that affect speech (for example verbosity).
    validations:
      required: true
