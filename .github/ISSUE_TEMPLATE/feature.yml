name: Feature request
description: Suggest new behaviour or a change to existing behaviour.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/nickvirden/spokenpath/blob/main/docs/roadmap.md)
        first: the request may already be planned, or listed as later work.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What spokenpath should do instead, from the user's side.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or approaches you tried, and why they fall short.
    validations:
      required: false
