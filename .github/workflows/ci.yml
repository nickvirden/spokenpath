name: CI

# pull_request, never its privileged base-branch variant: the jobs run with a
# read-only token and no secrets, so a fork's PR cannot reach anything that
# writes. `edited` re-runs the checks when the PR title changes, because the
# title becomes the squash-merge commit subject on main.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# A newer push to the same PR makes the older run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing by default; each job grants only what it uses.
permissions: {}

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install root dev tooling
        run: pnpm install --frozen-lockfile

      # The title is attacker-controlled text. It reaches the shell only as an
      # environment variable, never interpolated into the script.
      - name: Lint the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

  lint:
    name: lint
    runs-on: ubuntu-latest
    # Long enough for clippy and cargo-deny on a cold cache.
    timeout-minutes: 20
    permissions:
      contents: read
    # Dependabot does not track this version or checksum; bump both by hand
    # when actionlint releases.
    env:
      ACTIONLINT_VERSION: 1.7.12
      # From actionlint_1.7.12_checksums.txt on the release page.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from packageManager in package.json. It comes
      # before setup-node, which needs pnpm on PATH to cache its store.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # rustup installs the toolchain and components that rust-toolchain.toml
      # pins, so CI and local checkouts build with the same Rust.
      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # A pinned release checked against its published checksum, so a
      # replaced download fails the job instead of running.
      - name: Install actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # actionlint runs shellcheck over every run: block when shellcheck is on
      # PATH, which it is on GitHub's Ubuntu runners.
      - name: Lint workflows
        run: node --run lint:workflows

      - name: Lint git hooks
        run: node --run lint:hooks

      - name: Validate JSON configuration
        run: node --run lint:json

      - name: Install the pnpm workspace
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # `biome ci` never writes, and reports findings as annotations.
      - name: Check JS, TS and JSON with Biome
        run: pnpm exec biome ci .

      - name: Typecheck the packages
        run: pnpm -r typecheck

      # Licences, RustSec advisories, crate sources and bans, from deny.toml.
      - name: Check Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The repository has no code-scanning upload, so findings are reported
      # in the log and fail the job instead of going to the Security tab.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Dependabot bumps the action pin but not this input; bump it by
          # hand when zizmor releases.
          version: 1.32.0
          advanced-security: false
          annotations: true

  # Proves the pinned release tooling still computes the expected versions, so
  # a Dependabot bump that breaks it fails here rather than in a release on main.
  release-rules:
    name: release-rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install release tooling
        run: npm ci --ignore-scripts --prefix .github/release

      - name: Test version rules
        run: node --run test:release

      # The lockstep test runs `cargo metadata --locked` on a rewritten
      # Cargo.lock, so it needs the toolchain from rust-toolchain.toml.
      - name: Install the Rust toolchain
        run: rustup toolchain install

      - name: Test lockstep versions
        run: node --run test:versions

      # The test drives the JS API, which skips the CLI's Node version check.
      # Starting the CLI the release job runs catches a toolchain that no
      # longer supports the Node in .nvmrc.
      - name: Start the semantic-release CLI
        run: ./.github/release/node_modules/.bin/semantic-release --version

  test-rust:
    name: test-rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test the Cargo workspace
        run: cargo test --workspace --locked

      # The committed JSON Schema must be what the snapshot types generate, so
      # the TypeScript types and validator built from it match the Rust reader.
      - name: Check the committed snapshot schema
        run: cargo xtask schema --check

  # The model's, the announce crate's and the binary's tests read the committed captures and their
  # pages from disk, so they also run where paths, line endings and checkouts differ. Linux runs
  # them in test-rust.
  test-model:
    name: test-model (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test the model crate
        run: cargo test -p spokenpath_model --locked

      - name: Test the announce crate
        run: cargo test -p spokenpath_announce --locked

      - name: Test the spokenpath-core binary
        run: cargo test -p spokenpath_cli --locked

  test-node:
    name: test-node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install the pnpm workspace
        run: pnpm install --frozen-lockfile

      - name: Test the packages
        run: pnpm test:node

  # The capture tests drive the Chromium build that the pinned playwright-core
  # names, so a browser upgrade is a reviewed change to the capture goldens.
  test-capture:
    name: test-capture
    runs-on: ubuntu-latest
    # Long enough for the browser and its system dependencies to download.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install the pnpm workspace
        run: pnpm install --frozen-lockfile

      - name: Install the pinned Chromium
        run: pnpm --filter @spokenpath/capture-chromium exec playwright-core install --with-deps chromium

      - name: Test Chromium capture
        run: pnpm test:capture

  # The whole pipeline: the spokenpath command captures the sign-in page in the
  # pinned Chromium and pipes the snapshot to the spokenpath-core binary, and the
  # transcript must equal its committed golden.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # Long enough for the browser, its system dependencies and a cold Rust build.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install the pnpm workspace
        run: pnpm install --frozen-lockfile

      - name: Install the pinned Chromium
        run: pnpm --filter @spokenpath/capture-chromium exec playwright-core install --with-deps chromium

      - name: Test the spokenpath command end to end
        run: pnpm test:e2e

  # Scans every commit the pull request adds, so a secret committed without
  # the pre-commit hook (which skips when gitleaks is not installed) still
  # fails the pull request.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    # Dependabot does not track this version or checksum; bump both by hand
    # when gitleaks releases.
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt on the release page.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # The full history, so both ends of the pull request's range exist.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A pinned release checked against its published checksum, so a
      # replaced download fails the job instead of running.
      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # The SHAs reach the shell only as environment variables, never
      # interpolated into the script. Any finding exits non-zero.
      - name: Scan the pull request's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --config .gitleaks.toml --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}" .

  # The single required status check. Its name is referenced by the branch
  # ruleset, so it must stay `ci-ok`. It runs even when a needed job fails or
  # is skipped, and passes only when every needed job succeeded.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [pr-title, lint, zizmor, release-rules, test-rust, test-model, test-node, test-capture, e2e, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s\n' "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null
